name = "changi-board"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cron every 5 minutes: the Seletar board each run, Changi's every other run
# (still every 10 minutes; see runCron in src/index.js).
[triggers]
crons = ["*/5 * * * *"]

# Workers KV cache of the board, written only when the data changes.
# Create it once with:  npx wrangler kv namespace create BOARD_KV
# then paste the returned id below (replacing the zeros) and commit it.
[[kv_namespaces]]
binding = "BOARD_KV"
id = "ad70d054f310498c8dd03c492a40548b"

[vars]
# Comma-separated list of origins allowed to call the API ("*" = any).
# Lock this to your Pages URL once deployed, e.g. "https://changi-board.pages.dev".
ALLOWED_ORIGINS = "https://flightlah.pages.dev"
